<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 230" width="495" height="230">
  <title>MIYAZ — GitHub Stats</title>
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="statGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="1" y="1" width="493" height="228" rx="18" fill="#ffffff" stroke="#e9b8f0" stroke-width="1.3"/>
  <text x="24" y="26" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ec4899" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.1s" dur="0.5s" fill="freeze"/>GITHUB STATS
  </text>

  <g transform="translate(95,115.0)">
    <circle r="58" fill="none" stroke="#f0d9f7" stroke-width="10"/>
    <circle r="58" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="364.4" stroke-dashoffset="364.4" transform="rotate(-90)" filter="url(#statGlow)">
      <animate attributeName="stroke-dashoffset" values="364.4;25.5" begin="0.4s" dur="1.6s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.2 1"/>
    </circle>
    <text x="0" y="10" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#3b0764" opacity="0">
      <animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.5s" fill="freeze"/>A+
    </text>
    <text x="0" y="80" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#6b21a8">RANK</text>
  </g>

  
    <g opacity="0" transform="translate(-30,0)">
      <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" begin="0.5s" dur="0.5s" fill="freeze" additive="sum"/>
      <circle cx="210" cy="34" r="3.4" fill="#ec4899"/>
      <text x="224" y="38" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6b21a8">Total Stars</text>
      <rect x="224" y="44" width="236" height="6" rx="3" fill="#f0d9f7"/>
      <rect x="224" y="44" height="6" rx="3" width="0" fill="url(#barGrad)">
        <animate attributeName="width" values="0;26.5" begin="0.65s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.3 1"/>
      </rect>
      <text x="460" y="38" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13.5" font-weight="700" fill="#3b0764">340</text>
    </g>
    <g opacity="0" transform="translate(-30,0)">
      <animate attributeName="opacity" values="0;1" begin="0.6799999999999999s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" begin="0.6799999999999999s" dur="0.5s" fill="freeze" additive="sum"/>
      <circle cx="210" cy="70" r="3.4" fill="#ec4899"/>
      <text x="224" y="74" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6b21a8">Total Commits</text>
      <rect x="224" y="80" width="236" height="6" rx="3" fill="#f0d9f7"/>
      <rect x="224" y="80" height="6" rx="3" width="0" fill="url(#barGrad)">
        <animate attributeName="width" values="0;236.0" begin="0.83s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.3 1"/>
      </rect>
      <text x="460" y="74" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13.5" font-weight="700" fill="#3b0764">2100</text>
    </g>
    <g opacity="0" transform="translate(-30,0)">
      <animate attributeName="opacity" values="0;1" begin="0.86s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" begin="0.86s" dur="0.5s" fill="freeze" additive="sum"/>
      <circle cx="210" cy="106" r="3.4" fill="#ec4899"/>
      <text x="224" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6b21a8">Total PRs</text>
      <rect x="224" y="116" width="236" height="6" rx="3" fill="#f0d9f7"/>
      <rect x="224" y="116" height="6" rx="3" width="0" fill="url(#barGrad)">
        <animate attributeName="width" values="0;5.6" begin="1.01s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.3 1"/>
      </rect>
      <text x="460" y="110" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13.5" font-weight="700" fill="#3b0764">165</text>
    </g>
    <g opacity="0" transform="translate(-30,0)">
      <animate attributeName="opacity" values="0;1" begin="1.04s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" begin="1.04s" dur="0.5s" fill="freeze" additive="sum"/>
      <circle cx="210" cy="142" r="3.4" fill="#ec4899"/>
      <text x="224" y="146" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6b21a8">Total Issues</text>
      <rect x="224" y="152" width="236" height="6" rx="3" fill="#f0d9f7"/>
      <rect x="224" y="152" height="6" rx="3" width="0" fill="url(#barGrad)">
        <animate attributeName="width" values="0;-7.1" begin="1.19s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.3 1"/>
      </rect>
      <text x="460" y="146" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13.5" font-weight="700" fill="#3b0764">58</text>
    </g>
    <g opacity="0" transform="translate(-30,0)">
      <animate attributeName="opacity" values="0;1" begin="1.22s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" begin="1.22s" dur="0.5s" fill="freeze" additive="sum"/>
      <circle cx="210" cy="178" r="3.4" fill="#ec4899"/>
      <text x="224" y="182" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6b21a8">Contributed To</text>
      <rect x="224" y="188" width="236" height="6" rx="3" fill="#f0d9f7"/>
      <rect x="224" y="188" height="6" rx="3" width="0" fill="url(#barGrad)">
        <animate attributeName="width" values="0;-9.0" begin="1.3699999999999999s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.6 0.3 1"/>
      </rect>
      <text x="460" y="182" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="13.5" font-weight="700" fill="#3b0764">42</text>
    </g>
</svg>