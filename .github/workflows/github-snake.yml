name: Generate Snake Animation

"on":
  schedule:
    # Runs once a day at 00:00 UTC — GitHub contribution data updates daily,
    # so this keeps the snake in sync without wasting Action minutes.
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation SVGs
        uses: "Platane/snk@v3"
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff6ec7&color_dots=#2a1645,#4c1d95,#7c3aed,#a855f7,#ff6ec7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff6ec7&color_dots=#1a0b2e,#3a0ca3,#7c3aed,#c026d3,#ff6ec7
            dist/github-snake.gif?color_snake=#ff6ec7&color_dots=#2a1645,#4c1d95,#7c3aed,#a855f7,#ff6ec7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push the generated files to a dedicated "output" branch so they can be
      # embedded in README.md via a stable raw.githubusercontent.com URL:
      #   https://raw.githubusercontent.com/<user>/<user>/output/github-snake.svg
      - name: Push snake output to the "output" branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
